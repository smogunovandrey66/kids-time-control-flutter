name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart:
    name: Dart (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows is the target platform of the service; Linux is the fast feedback loop.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: dart pub get

      - name: Check formatting
        if: runner.os == 'Linux'
        run: dart format --output=none --set-exit-if-changed .

      - run: dart analyze --fatal-infos

      - name: Test ktc_core
        working-directory: packages/ktc_core
        run: dart test

      # On Windows this also runs the WinAPI tests against real processes.
      - name: Test ktc_service
        working-directory: apps/service
        run: dart test

      - name: Build ktc.exe
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          dart compile exe apps/service/bin/ktc.dart -o build/ktc.exe

      - name: Upload ktc.exe
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ktc-windows
          path: build/ktc.exe

  firestore-rules:
    name: Firestore rules (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
