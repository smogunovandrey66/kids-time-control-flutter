name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart:
    name: Dart (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows is the target platform of the service; Linux is the fast feedback loop.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: dart pub get

      - name: Check formatting
        if: runner.os == 'Linux'
        run: dart format --output=none --set-exit-if-changed .

      - run: dart analyze --fatal-infos

      - name: Test ktc_core
        working-directory: packages/ktc_core
        run: dart test
