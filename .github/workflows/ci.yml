name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart:
    name: Dart (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows is the target platform of the service; Linux is the fast feedback loop.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The workspace contains a Flutter app, so dependencies are resolved by flutter.
      - run: flutter pub get

      - name: Check formatting
        if: runner.os == 'Linux'
        run: dart format --output=none --set-exit-if-changed .

      - run: dart analyze --fatal-infos

      - name: Test ktc_core
        working-directory: packages/ktc_core
        run: dart test

      # On Windows this also runs the WinAPI tests against real processes.
      - name: Test ktc_service
        working-directory: apps/service
        run: dart test

      - name: Build ktc.exe
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          dart compile exe apps/service/bin/ktc.dart -o build/ktc.exe

      - name: Package with WinSW
        if: runner.os == 'Windows'
        run: |
          $package = 'build/kids-time-control-windows'
          New-Item -ItemType Directory -Force $package | Out-Null
          Copy-Item build/ktc.exe, packaging/windows/* $package
          Invoke-WebRequest https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW-x64.exe -OutFile "$package/KidsTimeControl.exe"
          Compress-Archive -Path "$package/*" -DestinationPath build/kids-time-control-windows.zip -Force

      # Installs the real service on the runner, checks that it runs and writes its log, removes it.
      - name: Install and start the service
        if: runner.os == 'Windows'
        run: |
          ./build/kids-time-control-windows/install.ps1
          Start-Sleep -Seconds 8
          $service = Get-Service KidsTimeControl
          if ($service.Status -ne 'Running') { throw "Service is $($service.Status)" }
          $log = Get-ChildItem "$env:ProgramData/KidsTimeControl/logs" -Filter *.out.log | Select-Object -First 1
          Get-Content $log.FullName
          if (-not (Select-String -Path $log.FullName -Pattern 'Kids Time Control' -Quiet)) { throw 'No service log' }

      - name: Uninstall the service
        if: runner.os == 'Windows'
        run: |
          ./build/kids-time-control-windows/uninstall.ps1 -RemoveData
          if (Get-Service KidsTimeControl -ErrorAction SilentlyContinue) { throw 'Service still installed' }

      - name: Upload the Windows package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: kids-time-control-windows
          path: build/kids-time-control-windows.zip

  parent-app:
    name: Parent app (Flutter Android)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Test
        working-directory: apps/parent
        run: flutter test
      - name: Build debug APK
        working-directory: apps/parent
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: parent-app-debug
          path: apps/parent/build/app/outputs/flutter-apk/app-debug.apk

  firestore-rules:
    name: Firestore rules and PC sync (emulators)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: .
      - run: npm ci
      - name: Rules tests
        run: npm test
      - name: PC <-> cloud end-to-end test
        run: npm run test:e2e
